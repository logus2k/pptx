<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Slides: the names templates use for fonts installed under other names (fonts/, mounted at /usr/share/fonts/slides;
     docs/licenses.md), so LibreOffice renders previews and PDFs in the template's own typeface. -->
<fontconfig>
  <!-- Banco CTT's Squad Model deck: its theme names "Helvetica Neue"; this machine has Linotype's Helvetica Neue LT Pro -->
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Helvetica Neue LT Pro</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue Light</family><prefer><family>Helvetica Neue LT Pro</family></prefer></alias>
  <!-- CTT's typeface, Acto CTT (CTT's web fonts, ctt.pt): one family, "Acto CTT", Thin to Black; decks made on Windows
       name some weights as families of their own ("Acto CTT Light", "Acto CTT Bold"): the family at that weight -->
  <match target="pattern"><test name="family"><string>Acto CTT Light</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Acto CTT</string></edit><edit name="weight" mode="assign"><const>light</const></edit></match>
  <match target="pattern"><test name="family"><string>Acto CTT Book</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Acto CTT</string></edit><edit name="weight" mode="assign"><const>book</const></edit></match>
  <match target="pattern"><test name="family"><string>Acto CTT Medium</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Acto CTT</string></edit><edit name="weight" mode="assign"><const>medium</const></edit></match>
  <match target="pattern"><test name="family"><string>Acto CTT Bold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Acto CTT</string></edit><edit name="weight" mode="assign"><const>bold</const></edit></match>
  <match target="pattern"><test name="family"><string>Acto CTT Black</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Acto CTT</string></edit><edit name="weight" mode="assign"><const>black</const></edit></match>
</fontconfig>
