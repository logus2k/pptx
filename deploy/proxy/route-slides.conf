# slides - the AI Slide Assistant, public path /slides/ (~/env/assets/pptx; container `slides` publishes host port 2720).
# Modelled on route-cortex.conf. Sign-in with Microsoft Entra ID through oauth2-proxy-entra (route-entra.conf), allow-list
# endpoint /oauth2-entra/auth-slides. Every location is gated, socket.io too. The identity is forwarded as
# X-Auth-Request-Email; on socket.io also Microsoft Graph's access token (X-Access-Token: the person's own name and photo)
# and the ID token (X-Id-Token: the sign-out hint). X-Forwarded-Prefix tells the app where it is served (its <base href>).
# The app trusts the identity only with the secret from secrets/slides.conf (git-ignored).

location = /slides {
	auth_request /oauth2-entra/auth-slides;
	error_page 401 = /oauth2-entra/sign_in;
	return 301 /slides/;
}

location ^~ /slides/socket.io/ {
	auth_request /oauth2-entra/auth-slides;
	error_page 401 = /oauth2-entra/sign_in;
	auth_request_set $slides_email $upstream_http_x_auth_request_email;
	proxy_set_header X-Auth-Request-Email $slides_email;
	auth_request_set $slides_at $upstream_http_x_auth_request_access_token;
	proxy_set_header X-Access-Token $slides_at;
	auth_request_set $slides_idt $upstream_http_authorization;
	proxy_set_header X-Id-Token $slides_idt;
	include /etc/nginx/conf-host/secrets/slides.conf;

	proxy_pass http://host.docker.internal:2720/socket.io/;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection $connection_upgrade;
	proxy_set_header Origin $http_origin;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	# longer than the longest assistant turn (technical design section 5.3: 180 s)
	proxy_read_timeout 600s;
	proxy_send_timeout 600s;
	proxy_buffering off;
	add_header Cache-Control "no-store";
}

location ^~ /slides/ {
	auth_request /oauth2-entra/auth-slides;
	error_page 401 = /oauth2-entra/sign_in;
	# deck uploads (spec PM-1: 100 MB by default), streamed to the app
	client_max_body_size 100m;
	proxy_request_buffering off;
	auth_request_set $slides_page_email $upstream_http_x_auth_request_email;
	proxy_set_header X-Auth-Request-Email $slides_page_email;
	proxy_set_header X-Access-Token "";
	proxy_set_header X-Id-Token "";
	proxy_set_header X-Forwarded-Prefix /slides;
	include /etc/nginx/conf-host/secrets/slides.conf;

	proxy_pass http://host.docker.internal:2720/;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_read_timeout 600s;
	proxy_send_timeout 600s;
	proxy_buffering off;
}
